server {
    listen       1226;
    server_name  localhost;

    charset utf-8;

    # 威胁情报拉取使用随包根证书；文件不存在会导致 nginx 启动失败
    lua_ssl_trusted_certificate /usr/local/openresty/zhongkui-waf/conf/certs/ca-bundle.pem;
    lua_ssl_verify_depth 3;

    # 仅对 admin 后台启用文本类资源压缩；gzip_types 配在 server 级，不影响其他站点
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # 让自定义 nginx 片段等表单提交尽量留在内存中（超过阈值仍需读取临时文件）
    client_body_buffer_size 128k;

    #access_log  logs/zhongkui.access.log  main;

    # path-to-zhongkui-waf/admin
    set $root_path /usr/local/openresty/zhongkui-waf/admin;

    location = /admin/data/user.json {
        deny all;
        return 403;
    }

    location ^~ /admin/lua/ {
        deny all;
        return 403;
    }

    location ^~ /ssl-certs/ {
        deny all;
        return 403;
    }

    location ^~ /conf/ {
        deny all;
        return 403;
    }
    
    # 静态资源缓存（仅 admin 后台，HTML 不缓存）
    location ^~ /admin/data/ {
        root    $root_path;
        expires 7d;
    }

    location ^~ /component/ {
        root    $root_path;
        expires 7d;
    }

    location ^~ /js/ {
        root    $root_path;
        expires 7d;
    }

    location / {
        root   $root_path;
        proxy_set_header  Host  $host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /user/ {
        content_by_lua_block {
            local user = require "user"
            user.do_request()
        }
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(html)$ {
        access_by_lua_block {
            local user = require "user"
            if user.check_auth_token() == false then
                ngx.header.content_type = 'text/html'
                ngx.say('<script>window.location.href="/login"</script>')
                --ngx.redirect("/login")
            end
        }

        root   $root_path;
        proxy_set_header  Host  $host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login {
        default_type 'text/html';
        alias $root_path/login.html;
        proxy_set_header  Host  $host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sites/ {
        content_by_lua_file $root_path/lua/website.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /defense/ {
        content_by_lua_file $root_path/lua/defense.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sensitive/ {
        content_by_lua_file $root_path/lua/sensitive.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /dashboard {
        content_by_lua_file $root_path/lua/dashboard.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /events/ {
        content_by_lua_file $root_path/lua/events.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ipblocking/ {
        content_by_lua_file $root_path/lua/ip_blocking.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ip/ {
        content_by_lua_file $root_path/lua/ip_filter.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /bot/ {
        content_by_lua_file $root_path/lua/bot.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /cc/ {
        content_by_lua_file $root_path/lua/cc_defense.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /acl/ {
        content_by_lua_file $root_path/lua/acl.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /common/certificate/ {
        content_by_lua_file $root_path/lua/certificate.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 本机调度器专用，免登录触发到期证书续期
    location = /common/certificate/acme/renew-due {
        allow 127.0.0.1;
        allow ::1;
        allow ::ffff:127.0.0.1;
        deny all;
        content_by_lua_file $root_path/lua/certificate.lua;
    }

    # 本机调度器专用，免登录触发威胁情报更新
    location = /common/ipgroups/refresh-due {
        allow 127.0.0.1;
        allow ::1;
        allow ::ffff:127.0.0.1;
        deny all;
        content_by_lua_file $root_path/lua/ip_group.lua;
    }

    location /common/ipgroups/ {
        content_by_lua_file $root_path/lua/ip_group.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /system/ {
        content_by_lua_file $root_path/lua/system.lua;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}