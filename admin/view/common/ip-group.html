<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
		<title>IP组</title>
		<link href="../../component/pear/css/pear.css" rel="stylesheet">
	</head>
	<body class="pear-container">
		<div class="layui-row layui-col-space10">
			<div class="layui-col-md12">
				<div class="layui-card">
					<div class="layui-card-header">IP组</div>
					<div class="layui-card-body">
						<div class="layui-row layui-col-space10">
							<div class="layui-col-md12">
								<table id="id-table-rules" lay-filter="filter-table-rules"></table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<form class="layui-form" style="background-color:#fff;padding: 10px 15px;display: none;" lay-filter="filter-form-rule" id="id-form-rule">
			<input type="hidden" name="id" />
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">规则名称</div>
			</div>
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<input type="text" name="groupName" lay-verify="required" autocomplete="off" class="layui-input" />
				</div>
			</div>
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">IP列表</div>
			</div>
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<div class="layui-form-text">
						<textarea name="ips" lay-verify="required|ipsRule" placeholder="每行一个 IP/CIDR，支持 # 注释：&#10;# 办公网段&#10;10.0.0.0/24&#10;192.168.1.10 # 封禁：异常扫描" style="height: 210px;" class="layui-textarea"></textarea>
					</div>
				</div>
			</div>
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<div style="float: right;">
						<button type="submit" class="pear-btn pear-btn-primary" lay-submit lay-filter="filter-rule-save">保存</button>
						<button type="button" class="pear-btn" lay-on="cancel">取消</button>
					</div>
				</div>
			</div>
		</form>
		<script type="text/html" id="user_toolbar">
			<button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
				<i class="layui-icon layui-icon-add-1"></i>添加IP组
			</button>
		</script>
		<script type="text/html" id="iplist_bar">
			{{# if (d.managed) { }}
			<button class="pear-btn pear-btn-primary pear-btn-xs" lay-event="refresh"><i class="layui-icon layui-icon-refresh"></i> 更新</button>
			{{# } else { }}
			<button class="pear-btn pear-btn-primary pear-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i></button>
			<button class="pear-btn pear-btn-danger pear-btn-xs" lay-event="remove"><i class="layui-icon layui-icon-delete"></i></button>
			{{# } }}
		</script>
		<script type="text/html" id="iplist_state">
			<input type="checkbox" name="state" value="{{= d.id }}" lay-skin="switch" title="ON|OFF" {{= d.state == "on" ? "checked" : "" }} />
		</script>

		<script src="../../component/layui/layui.js"></script>
		<script src="../../component/pear/pear.js"></script>
		<script src="../../js/validator.js"></script>
		<script>
			layui.use(['form','table','util','jquery','popup'], function() {
				var table = layui.table;
				var form = layui.form;
				var util = layui.util;
				var element = layui.element
				var $ = layui.$;
				var popup = layui.popup;

				var currentTabId;

				// 去掉 # 及其后的行尾注释，并 trim；整行注释会返回空串
				var parseIpLine = function(line) {
					return (line || '').split('#')[0].trim();
				};

				var isManaged = function(d) {
					return !!(d && d.managed === true);
				};

				// 后台时间统一存 UTC，展示时转本地 yyyy-MM-dd HH:mm:ss
				var formatTime = function(v) {
					if (!v) {
						return '';
					}

					var date = new Date(v);
					if (isNaN(date.getTime())) {
						return v;
					}

					var pad = function(n) {
						return (n < 10 ? '0' : '') + n;
					};

					return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
						' ' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
				};

				var statusText = function(d) {
					// 后台发现元数据里记录过更新，但本地名单文件已不存在
					if (d.fileMissing) {
						return '数据文件缺失，请点击更新';
					}

					switch (d.lastStatus) {
						case 'updated': return d.lastUpdate ? '已更新 ' + formatTime(d.lastUpdate) : '已更新';
						case 'not_modified': return d.lastUpdate ? '已是最新 ' + formatTime(d.lastUpdate) : '已是最新';
						case 'unchanged': return '内容无变化';
						case 'error': return '更新失败：' + (d.lastError || '未知错误');
						default: return '尚未更新';
					}
				};

				// 更新期间只让按钮图标转圈，不再铺全屏遮罩
				var toggleLoading = function($btn, loading) {
					if (!$btn || !$btn.length) {
						return;
					}

					var $icon = $btn.find('i');

					if (loading) {
						$btn.data('originIcon', $icon.attr('class'));
						$btn.prop('disabled', true).css('opacity', 0.6);
						$icon.attr('class', 'layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop');
						return;
					}

					$btn.prop('disabled', false).css('opacity', 1);
					var origin = $btn.data('originIcon');
					if (origin) {
						$icon.attr('class', origin);
					}
				};

				var refreshGroup = function(id, $btn, force) {
					toggleLoading($btn, true);

					$.post('/common/ipgroups/refresh', {id: id, force: force ? 1 : 0}, function(res) {
						toggleLoading($btn, false);

						if (res && res.code == 200) {
							table.reloadData('id-table-rules');
							if (res.data && res.data.failed > 0) {
								popup.failure(res.msg || '部分数据源更新失败');
							} else {
								popup.success(res.msg || '更新完成');
							}
							return;
						}

						var msg = (res && res.msg) || '更新失败';

						// 上游条目骤降被拦下时，允许确认后强制更新
						if (msg.indexOf('条目数异常减少') >= 0) {
							layer.confirm(msg + '，仍要强制更新吗？', {icon: 3, title: '提示'}, function(index) {
								layer.close(index);
								refreshGroup(id, $btn, true);
							});
							return;
						}

						popup.failure(msg);
					}, "json").fail(function() {
						toggleLoading($btn, false);
						popup.failure('请求失败');
					});
				};

				table.render({
					elem: '#id-table-rules',
					url: '/common/ipgroups/list',
					cols: [[ //标题栏
						{field: 'groupName', title: '组名'},
						{title: '内容', templet: function(d) {
							if (isManaged(d)) {
								return (d.ipCount || 0) + ' 条';
							}
							// 预览时忽略空行与注释（含行尾注释）
							let ips = (d.ips || []).map(parseIpLine).filter(item => item.length > 0);
							let len = ips.length;
							if (len > 1) {
								return ips[0] + '...';
							} else if (len > 0) {
								return ips[0];
							}
						}},
						{title: '状态', width: 260, templet: function(d) {
							return isManaged(d) ? statusText(d) : '-';
						}},
						{fixed: 'right', title:'操作', width: 110, minWidth: 110, toolbar: '#iplist_bar'}
					]],
					toolbar: '#user_toolbar',
					skin: 'line',
					page: true, // 是否显示分页
					limits: [5, 10, 15, 20, 25, 30],
					limit: 10, // 每页默认显示的数量
				});

				function openLayer(title) {
					layer.open({
						type: 1,
						title: title,
						shade: 0.6,
						shadeClose: true,
						area: ['430px', '440px'],
						content: $('#id-form-rule'),
						end: function() {
							$("#id-form-rule").trigger("reset");
							$("#id-form-rule").find("input[type='hidden']").val("");
						}
					});
				}

				// 触发单元格工具事件
				table.on('tool(filter-table-rules)', function(obj) {
					var data = obj.data; // 获得当前行数据

					if(obj.event === 'edit') {
						$.get('/common/ipgroups/get',  {id: data.id}, function(res) {
							if (res && res.code == 200) {
								openLayer('编辑IP组');

								let data = res.data;
								let ips = data.ips;

								data.ips = ips.join('\n');
								form.val('filter-form-rule', data);
							} else {
								popup.failure(res.msg);
								return false;
							}
						}, "json");

					} else if(obj.event === 'refresh') {
						refreshGroup(data.id, $(obj.tr).find('[lay-event="refresh"]'));

					} else if(obj.event === 'remove') {
						layer.confirm('确定删除该IP组吗？', {
							icon: 3,
							title: '提示'
						}, 
						function(index) {
							$.post('/common/ipgroups/remove',  {id: data.id}, function(resData) {
								if (resData && resData.code == 200) {
									obj.del();
									table.reloadData('id-table-rules');
									layer.close(index);
									return true;
								} else {
									popup.failure(resData.msg);
									return false;
								}
							}, "json");
						});
					}
				});

				table.on('toolbar(filter-table-rules)', function(obj) {
					if (obj.event === 'add') {
						openLayer('添加IP组');
					}
				});

				util.on('lay-on', {
					cancel: function() {
						layer.closeLast('page');
					}
				});

				form.verify({
					ipsRule: function(value, elem) {
						if (value.trim().length > 0) {
							let arr = value.split('\n');
							let flag = false;
							$.each(arr, function(i, ip) {
								// 忽略空行与注释（含行尾注释）
								ip = parseIpLine(ip);
								if (ip.length === 0) {
									return true;
								}
								if (validator.isIPWithCIDR(ip) == false) {
									flag = true;
									return false;
								}
							});
							if (flag) {
								return "ip格式不正确";
							}
						} else {
							return "ip组内容不能为空";
						}
					}
				});

				// 提交事件
				form.on('submit(filter-rule-save)', function(data) {
					var field = data.field; // 获取表单字段值
					field.groupName = field.groupName.trim();
					let arr = field.ips.split('\n');
					// 每行 trim，去掉空行，保留注释行
					let newArr = arr.map(item => item.trim()).filter(item => item.length > 0);
					field.ips = newArr;

					$.post('/common/ipgroups/update',  {rule: JSON.stringify(field)}, function(data) {
						if (data && data.code == 200) {
							table.reloadData('id-table-rules');
							layer.closeLast('page');
							popup.success("已保存");
							return true;
						} else {
							popup.failure(data.msg);
							return false;
						}
					}, "json");

					return false;
				});
			});

		</script>
	</body>
</html>
