<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
		<title>IP封禁日志</title>
		<link href="../component/pear/css/pear.css" rel="stylesheet">
	</head>
	<body class="pear-container">
		<div class="layui-row">
			<div class="layui-col-md12">
				<div class="layui-card">
					<div class="layui-card-header">IP封禁日志</div>
					<div class="layui-card-body">
						<div class="layui-row">
							<div class="layui-col-md12">
								<table id="id-table-logs" lay-filter="filter-table-logs"></table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script type="text/html" id="user_toolbar">
			<form class="layui-form" id="ipblock-toolbar">
				<div class="layui-row layui-col-space8">
					<div class="layui-col-md3">
						<input type="text" name="ip" value="" placeholder="封禁IP" class="layui-input" lay-affix="clear" />
					</div>
					<div class="layui-col-md3">
						<select name="block_reason" id="block_reason">
							<option value="">封禁原因-全部</option>
						</select>
					</div>
					<div class="pear-btn-container layui-col-md2">
						<button id="ipblock-search-btn" class="pear-btn pear-btn-primary pear-btn-md" lay-submit lay-filter="filter-table-search">查询</button>
						<button type="reset" class="pear-btn pear-btn-md">重置</button>
					</div>
				</div>
				<div class="layui-row layui-col-space8" style="margin-top:8px;">
					<div class="layui-col-md12" id="ipblock-presets" style="display:flex;gap:8px;flex-wrap:wrap;">
						<button type="button" class="pear-btn pear-btn-md tr-preset" data-preset="1h">最近 1 小时</button>
						<button type="button" class="pear-btn pear-btn-md tr-preset" data-preset="24h">最近 24 小时</button>
						<span style="width:1px;background:#e6e6e6;margin:0 4px;"></span>
						<button type="button" class="pear-btn pear-btn-md tr-preset" data-preset="today">今天</button>
						<button type="button" class="pear-btn pear-btn-md tr-preset" data-preset="7d">近 7 天</button>
						<button type="button" class="pear-btn pear-btn-md tr-preset" data-preset="30d">近 30 天</button>
						<button type="button" class="pear-btn pear-btn-md tr-preset" data-preset="custom">自定义</button>
					</div>
				</div>
				<div class="layui-row layui-col-space8" style="margin-top:8px;">
					<div class="layui-col-md3">
						<input type="text" name="startTime" id="ipblock-start-time" placeholder="开始时间" class="layui-input" readonly />
					</div>
					<div class="layui-col-md3">
						<input type="text" name="endTime" id="ipblock-end-time" placeholder="结束时间" class="layui-input" readonly />
					</div>
				</div>
			</form>
		</script>
		<script type="text/html" id="table_bar">
			<span lay-event="unblock" style="cursor: pointer;">解封</span>
		</script>

		<script src="../component/layui/layui.js"></script>
		<script src="../component/pear/pear.js"></script>
		<script src="../js/action.js"></script>
		<script src="../js/attackType.js"></script>
		<script src="../js/time-range.js"></script>
		<script>
			layui.use(['form','table','laydate','jquery','popup'], function() {
				var table = layui.table;
				var form = layui.form;
				var popup = layui.popup;
				var $ = layui.$;
				var laydate = layui.laydate;

				// 时间范围规则见 admin/js/time-range.js，后端兜底见 admin/lua/ip_blocking.lua
				var tf = TimeRangeFilter.init({
					$: $,
					laydate: laydate,
					start: '#ipblock-start-time',
					end: '#ipblock-end-time',
					presets: '#ipblock-presets'
				});

				table.render({
					elem: '#id-table-logs',
					url: '/ipblocking/list',
					where: tf.defaultRange,
					// 后端无数据时 data 是 {} 而非 []，统一成数组才能渲染空态行
					parseData: function(res) {
						res.data = res.data && res.data.length ? res.data : [];
						res.count = res.count || 0;
						return res;
					},
					text: {
						none: '暂无记录'
					},
					cols: [[ //标题栏
						{field: 'ip', title: 'IP', templet: function(d) {
							if (d.ip_country_cn == 'CN') {
								if (d.ip_province_cn == d.ip_city_cn) {
									return '<div>' + d.ip + '(' + d.ip_country_cn + '-' + d.ip_city_cn + ')' + '</div>';
								} else {
									return '<div>' + d.ip + '(' + d.ip_province_cn + '-' + d.ip_city_cn + ')' + '</div>';
								}
							} else {
								return '<div>' + d.ip + '(' + d.ip_country_cn + ')' + '</div>';
							}
						}},
						{field: 'block_reason', title: '封禁原因'},
						{field: 'action', title: '处置动作', templet: function(d) {
							return '<div>' + getActionText(d.action) + '</div>';
						}},
						{field: 'start_time', title: '封禁开始时间'},
						{field: 'block_duration', title: '封禁时长', templet: function(d) {
							if (d.block_duration == 0) {
								return '<div>永久</div>';
							} else {
								return '<div>' + d.block_duration + ' 秒</div>';
							}
						}},
						{field: 'end_time', title: '封禁结束时间'},
						{field: 'unblock_time', title: '状态', templet: function(d) {
							if (d.unblock_time != null) {
								return '<div>已解封</div>';
							} else if (d.end_time != null && new Date() > new Date(d.end_time)) {
								return '<div>已结束</div>';
							} else {
								return '<div>封禁中</div>';
							}
						}},
						{fixed: 'right', title:'操作', width: 60, minWidth: 60, toolbar: '#table_bar'}
					]],
					toolbar: '#user_toolbar',
					page: true, // 是否显示分页
					limits: [10, 15, 20, 25, 30, 50, 100],
					limit: 10, // 每页默认显示的数量
					done: function(res) {
						tf.bindPickers();
						tf.sync(res);
					}
				});

				// 触发单元格工具事件
				table.on('tool(filter-table-logs)', function(obj) {
					var data = obj.data; // 获得当前行数据

					if(obj.event === 'unblock') {
						if (data.unblock_time != null || (data.end_time != null && new Date(data.end_time) < new Date())) {
							return;
						}

						layer.confirm('确定解除对该IP的封禁吗？', {
							icon: 3,
							title: '提示'
						}, 
						function(index) {
							$.post('/ipblocking/unblock',  {id: data.id}, function(res) {
								if (res && res.code == 200) {
									table.reloadData('id-table-logs');
									layer.close(index);
									return true;
								} else {
									popup.failure(res.msg);
									return false;
								}
							}, "json");
						});
					}
				});

				form.on('submit(filter-table-search)', function(data) {
					var range = tf.validate();
					if (range.msg) {
						popup.failure(range.msg);
						return false;
					}

					data.field.startTime = range.startTime;
					data.field.endTime = range.endTime;

					table.reloadData('id-table-logs', {
						page: {
							curr: 1
						},
						where: data.field
					});
					return false;
				});

				$(document).on('click', '#ipblock-presets .tr-preset', function() {
					var key = $(this).attr('data-preset');
					tf.apply(key);
					if (key !== 'custom') {
						$('#ipblock-search-btn').trigger('click');
					}
				});

				$(document).on('click', '#ipblock-toolbar button[type="reset"]', function() {
					setTimeout(function() {
						tf.reset();
						$('#ipblock-search-btn').trigger('click');
					}, 0);
				});

				$(function(){
					initAttackTypeSelect('block_reason', function() {
						form.render($('#block_reason'));
					});
					// 阻止回车触发表单提交
					$(document).on('keydown', function (e) {
						if (e.keyCode === 13) {
							e.preventDefault();
							return false;
						}
					});
				});
			});
		</script>
	</body>
</html>
