<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
		<title>防护站点</title>
		<link href="../component/pear/css/pear.css" rel="stylesheet">
		<style>
			.cert-picker {
				position: relative;
			}
			.cert-picker-trigger {
				display: flex;
				align-items: center;
				min-height: 38px;
				padding: 0 32px 0 8px;
				background: #fff;
				border: 1px solid #d2d2d2;
				border-radius: 2px;
				line-height: 36px;
				cursor: pointer;
				box-sizing: border-box;
			}
			.cert-picker-trigger:hover,
			.cert-picker.open .cert-picker-trigger {
				border-color: #16baaa;
			}
			.cert-picker-arrow {
				position: absolute;
				right: 10px;
				top: 50%;
				color: #999;
				transform: translateY(-50%);
				transition: transform .2s;
			}
			.cert-picker.open .cert-picker-arrow {
				transform: translateY(-50%) rotate(180deg);
			}
			.cert-picker-value {
				display: flex;
				align-items: center;
				gap: 6px;
				min-width: 0;
				flex: 1;
				overflow: hidden;
			}
			.cert-picker-trigger:not(.has-value) .cert-picker-value {
				color: #999;
			}
			.cert-picker-value-text {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.cert-picker-value-meta {
				flex: none;
				color: #999;
				font-size: 12px;
				white-space: nowrap;
				font-variant-numeric: tabular-nums;
			}
			.cert-picker-pills {
				display: flex;
				gap: 4px;
				flex: none;
			}
			.cert-pill {
				display: inline-flex;
				align-items: center;
				height: 20px;
				padding: 0 8px;
				border: 1px solid transparent;
				border-radius: 4px;
				font-size: 12px;
				line-height: 20px;
				white-space: nowrap;
			}
			.cert-pill-success {
				background: #f0f9eb;
				border-color: #e1f3d8;
				color: #67c23a;
			}
			.cert-pill-warning {
				background: #fdf6ec;
				border-color: #faecd8;
				color: #e6a23c;
			}
			.cert-pill-danger {
				background: #fef0f0;
				border-color: #fde2e2;
				color: #f56c6c;
			}
			.cert-pill-info {
				background: #ecf5ff;
				border-color: #d9ecff;
				color: #409eff;
			}
			.cert-pill-muted {
				background: #f4f4f5;
				border-color: #e9e9eb;
				color: #909399;
			}
			.cert-picker-panel {
				display: none;
				position: absolute;
				left: 0;
				right: 0;
				top: calc(100% + 4px);
				z-index: 19891020;
				background: #fff;
				border: 1px solid #e6e6e6;
				border-radius: 2px;
				box-shadow: 0 2px 12px rgba(0, 0, 0, .12);
			}
			.cert-picker-search {
				padding: 8px;
				border-bottom: 1px solid #eee;
			}
			.cert-picker-list {
				max-height: 260px;
				overflow-y: auto;
			}
			.cert-picker-option {
				display: flex;
				align-items: flex-start;
				gap: 8px;
				padding: 6px 10px;
				cursor: pointer;
			}
			.cert-picker-option:hover,
			.cert-picker-option.selected {
				background: #f5f7fa;
			}
			.cert-picker-option-main {
				min-width: 0;
				flex: 1;
			}
			.cert-picker-option-title {
				display: block;
				color: #333;
				line-height: 20px;
				word-break: break-all;
			}
			.cert-picker-option-meta {
				display: block;
				color: #999;
				font-size: 12px;
				line-height: 18px;
				font-variant-numeric: tabular-nums;
			}
			.cert-picker-empty {
				padding: 16px 10px;
				color: #999;
				font-size: 12px;
				text-align: center;
			}
		</style>
	</head>
	<body class="pear-container">
		<div class="layui-row">
			<div class="layui-col-md12">
				<div class="layui-card">
					<div class="layui-card-header">防护站点</div>
					<div class="layui-card-body">
						<div class="layui-row">
							<div class="layui-col-md12">
								<table id="id-table-rules" lay-filter="filter-table-rules"></table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<form class="layui-form" style="background-color:#fff;padding: 10px 15px;display: none;" lay-filter="filter-form-rule" id="id-form-rule">
			<input type="hidden" name="id" />
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">域名</div>
			</div>
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<div class="layui-btn-container tag" lay-filter="serverNames" lay-verify="serverNames" lay-allowclose="true" lay-newTag="true" id="serverNames"></div>
				</div>
			</div>

			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">监听端口</div>
			</div>

			<div class="layui-row layui-col-space10" id="sites">
				<div class="layui-col-md12">
					<div class="layui-row layui-col-space5 site-row">
						<div class="layui-col-md8">
							<input type="text" name="port" placeholder="80" lay-verify="required|number" lay-reqtext="监听端口不能为空" autocomplete="off" class="layui-input" />
						</div>
						<div class="layui-col-md4">
							<div class="layui-input-inline" style="width: 70%;">
								<label class="layui-form-label" style="width: 30px;">SSL</label>
								<input type="checkbox" name="ssl" lay-skin="switch" lay-filter="filter-switch-ssl" title="ON|OFF" />
							</div>
							<i class="layui-icon layui-icon-delete" style="cursor: pointer;vertical-align: middle;" lay-on="removeSite"></i>
						</div>
					</div>
					<div class="layui-row layui-col-space10" id="addSiteRow">
						<div class="layui-col-md12 layui-col-sm12" style="padding-left: 10px;" >
							<button type="button" class="pear-btn pear-btn-primary pear-btn-xs" lay-on="addSite">
								<i class="layui-icon layui-icon-add-1"></i>添加监听端口
							</button> 最多可添加3个端口
						</div>
					</div>
				</div>
			</div>

			<div class="layui-row layui-col-space10 cert" style="display: none;">
				<div class="layui-col-md12">SSL证书</div>
			</div>
			<div class="layui-row layui-col-space10 cert" style="display: none;">
				<div class="layui-col-md12">
					<div class="cert-picker" id="certPicker">
						<input type="hidden" id="certId" name="certId" lay-verify="certId" />
						<div class="cert-picker-trigger" id="certPickerTrigger">
							<span class="cert-picker-value" id="certPickerValue">请选择SSL证书</span>
							<i class="layui-icon layui-icon-down cert-picker-arrow"></i>
						</div>
						<div class="cert-picker-panel" id="certPickerPanel">
							<div class="cert-picker-search">
								<input type="text" id="certPickerSearch" class="layui-input" placeholder="搜索域名或颁发机构" autocomplete="off" />
							</div>
							<div class="cert-picker-list" id="certPickerList"></div>
						</div>
					</div>
					<div class="layui-form-mid layui-word-aux" style="padding-left: 0;">仅显示有效期内的证书；当前绑定的失效证书会保留并标记，请尽快更换。</div>
				</div>
			</div>

			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">上游服务器地址</div>
			</div>
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<input type="text" name="upstream" placeholder="http://192.168.0.1:8080" lay-verify="required|url" lay-reqtext="上游服务器地址不能为空" autocomplete="off" class="layui-input" />
				</div>
			</div>

			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">备注</div>
			</div>

			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<div class="layui-form-text">
						<textarea name="description" placeholder="请输入备注" class="layui-textarea"></textarea>
					</div>
				</div>
			</div>

			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<div style="float: right;">
						<button type="submit" class="pear-btn pear-btn-primary" lay-submit lay-filter="filter-rule-save">保存</button>
						<button type="button" class="pear-btn" lay-on="ruleCancel">取消</button>
					</div>
				</div>
			</div>
		</form>

		<form class="layui-form" style="background-color:#fff;padding: 10px 15px;display: none;" id="id-form-adv">
			<blockquote class="layui-elem-quote" style="line-height: 24px; margin-bottom: 10px;">
				可以为站点补充 nginx 配置，例如上传大小、超时时间、请求头等。<br>
				为保障站点安全，此处不支持修改监听端口、域名、证书以及 WAF 相关指令。<br>
				高级配置独立保存、立即生效，与站点基本信息（域名、证书、上游地址）互不影响。<br>
				保存时会立即校验，如果配置有误，将自动恢复为修改前的内容。
			</blockquote>
			<div id="advConfigSites" style="display: none; margin-bottom: 10px; padding: 0 2px; color: #666; font-size: 12px; line-height: 20px; word-break: break-all;"></div>
			<textarea id="advConfigText" class="layui-textarea" style="min-height: 200px; font-family: Consolas, Monaco, monospace; line-height: 20px;" placeholder="# 示例：&#10;client_max_body_size 200m;&#10;proxy_read_timeout 300s;"></textarea>
			<div style="text-align: right; margin-top: 10px;">
				<button type="button" class="pear-btn pear-btn-primary" id="advConfigSave">保存</button>
				<button type="button" class="pear-btn" id="advConfigCancel">取消</button>
			</div>
		</form>

		<script type="text/html" id="user_toolbar">
			<button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
				<i class="layui-icon layui-icon-add-1"></i>
				添加站点
			</button>
		</script>
		<script type="text/html" id="rule_bar">
			<button class="pear-btn pear-btn-primary pear-btn-xs" lay-event="edit" title="编辑站点"><i class="layui-icon layui-icon-edit"></i></button>
			<button class="pear-btn pear-btn-xs" lay-event="adv" title="高级配置"><i class="layui-icon layui-icon-set"></i></button>
			<button class="pear-btn pear-btn-danger pear-btn-xs" lay-event="remove" title="删除站点"><i class="layui-icon layui-icon-delete"></i></button>
		</script>

		<script src="../component/layui/layui.js"></script>
		<script src="../component/pear/pear.js"></script>
		<script>
			layui.use(['form','table','util','jquery','popup','tag'], function() {
				var table = layui.table;
				var form = layui.form;
				var util = layui.util;
				var popup = layui.popup;
				var tag = layui.tag;
				var $ = layui.$;
				var certData = [];
				var certSelectedId = '';
				var siteLayerIndex = null;
				var advLayerIndex = null;

				function tagRender() {
					tag.render("serverNames", {
						tagText: '<i class="layui-icon layui-icon-add-1"></i>添加域名'
					});
				}

				function certTitleText(item) {
					return item.certName || item.domainName || '';
				}

				function certMetaText(item) {
					var parts = [];
					if (item.expirationDate) {
						parts.push('有效期至 ' + item.expirationDate);
					}
					if ((item.status === 'valid' || item.status === 'expiring') && item.daysLeft !== null && item.daysLeft !== undefined) {
						parts.push('剩余 ' + Math.max(0, item.daysLeft) + ' 天');
					}
					return parts.join(' · ');
				}

				// 剩余天数按紧急度着色，颜色复用 layui 提供的字体工具类
				function certDaysClass(item) {
					if ((item.status !== 'valid' && item.status !== 'expiring')
						|| item.daysLeft === null || item.daysLeft === undefined) {
						return '';
					}

					var days = Math.max(0, item.daysLeft);
					if (days <= 7) {
						return 'layui-font-red';
					}
					if (days <= 30) {
						return 'layui-font-orange';
					}
					return '';
				}

				// 第二行：有效期 + 剩余天数，天数单独着色，便于按紧急度扫读
				function appendCertMeta($target, item) {
					var showDays = (item.status === 'valid' || item.status === 'expiring')
						&& item.daysLeft !== null && item.daysLeft !== undefined;

					if (item.expirationDate) {
						$target.append(document.createTextNode('有效期至 ' + item.expirationDate));
						if (showDays) {
							$target.append(document.createTextNode(' · '));
						}
					}

					if (showDays) {
						$('<span>').addClass(certDaysClass(item))
							.text('剩余 ' + Math.max(0, item.daysLeft) + ' 天')
							.appendTo($target);
					}
				}

				function certPills(item) {
					var pills = [];
					if (item.isCurrentBound) {
						pills.push({text: '当前绑定', cls: 'cert-pill-info'});
					}
					if (item.status === 'valid') {
						pills.push({text: '有效', cls: 'cert-pill-success'});
					} else if (item.status === 'expiring') {
						pills.push({text: '即将到期', cls: 'cert-pill-warning'});
					} else if (item.status === 'expired') {
						pills.push({text: '已过期', cls: 'cert-pill-danger'});
					} else if (item.reason === 'missing_files') {
						pills.push({text: '文件缺失', cls: 'cert-pill-danger'});
					} else if (item.reason === 'not_effective') {
						pills.push({text: '尚未生效', cls: 'cert-pill-warning'});
					} else if (item.reason === 'invalid_date') {
						pills.push({text: '日期异常', cls: 'cert-pill-muted'});
					} else {
						pills.push({text: '不可用', cls: 'cert-pill-muted'});
					}
					return pills;
				}

				function certPillsText(item) {
					var text = [];
					$.each(certPills(item), function(i, pill) {
						text.push(pill.text);
					});
					return text.join(' ');
				}

				function appendCertPills($target, item) {
					$.each(certPills(item), function(i, pill) {
						$('<span>').addClass('cert-pill ' + pill.cls).text(pill.text).appendTo($target);
					});
				}

				function renderCertTrigger(item) {
					var $value = $('#certPickerValue').empty();
					if (!item) {
						$value.text('请选择SSL证书');
						$('#certPickerTrigger').removeClass('has-value');
						return;
					}

					var $pills = $('<span class="cert-picker-pills">');
					appendCertPills($pills, item);
					$value.append($pills);
					$('<span class="cert-picker-value-text">').text(certTitleText(item)).appendTo($value);

					if (certMetaText(item)) {
						var $meta = $('<span class="cert-picker-value-meta">');
						appendCertMeta($meta, item);
						$meta.appendTo($value);
					}
					$('#certPickerTrigger').addClass('has-value');
				}

				function renderCertList(keyword) {
					var $list = $('#certPickerList').empty();
					keyword = $.trim(keyword || '').toLowerCase();

					if (!certData.length) {
						$('<div class="cert-picker-empty">').text('暂无可用证书，请先到证书管理添加或申请').appendTo($list);
						return;
					}

					var visible = 0;
					$.each(certData, function(i, item) {
						var searchText = (certTitleText(item) + ' ' + certMetaText(item) + ' ' + certPillsText(item)).toLowerCase();
						if (keyword && searchText.indexOf(keyword) < 0) {
							return;
						}

						visible++;
						var $option = $('<div class="cert-picker-option">').attr('data-id', item.id);
						if (String(item.id) === String(certSelectedId)) {
							$option.addClass('selected');
						}

						var $pills = $('<span class="cert-picker-pills">');
						appendCertPills($pills, item);
						$option.append($pills);

						var $main = $('<div class="cert-picker-option-main">');
						$('<span class="cert-picker-option-title">').text(certTitleText(item)).appendTo($main);
						if (certMetaText(item)) {
							var $meta = $('<span class="cert-picker-option-meta">');
							appendCertMeta($meta, item);
							$meta.appendTo($main);
						}
						$option.append($main);
						$list.append($option);
					});

					if (keyword && visible === 0) {
						$('<div class="cert-picker-empty">').text('无匹配证书').appendTo($list);
					}
				}

				function positionCertPanel() {
					var trigger = $('#certPickerTrigger')[0];
					if (!trigger) {
						return;
					}

					var $panel = $('#certPickerPanel');
					var rect = trigger.getBoundingClientRect();
					var margin = 8;
					var width = Math.max(rect.width, 320);
					var left = rect.left;
					if (left + width > window.innerWidth - margin) {
						left = window.innerWidth - width - margin;
					}
					if (left < margin) {
						left = margin;
					}

					var panelHeight = $panel.outerHeight();
					var spaceBelow = window.innerHeight - rect.bottom - margin;
					var spaceAbove = rect.top - margin;
					var openUp = panelHeight > spaceBelow && spaceAbove > spaceBelow;

					$panel.css({
						position: 'fixed',
						left: left + 'px',
						right: 'auto',
						width: width + 'px',
						top: openUp ? 'auto' : (rect.bottom + 4) + 'px',
						bottom: openUp ? (window.innerHeight - rect.top + 4) + 'px' : 'auto'
					});
				}

				function openCertPanel() {
					if ($('#certPicker').hasClass('open')) {
						return;
					}

					var $panel = $('#certPickerPanel');
					if (!$panel.parent().is('body')) {
						$panel.appendTo(document.body);
					}

					$('#certPickerSearch').val('');
					renderCertList('');
					$('#certPicker').addClass('open');
					$panel.show();
					positionCertPanel();

					setTimeout(function() {
						$('#certPickerSearch').focus();
					}, 0);
				}

				function closeCertPanel() {
					$('#certPicker').removeClass('open');
					$('#certPickerPanel').hide();
				}

				// 证书区域显隐，与 SSL 开关状态保持一致
				function setCertVisible(visible) {
					if (visible) {
						$(".cert").show();
					} else {
						closeCertPanel();
						$(".cert").hide();
					}
				}

				// 按内容自适应弹窗高度：放得下就贴合内容，超出可视区才限高并出现滚动条
				function resizeSiteLayer(index) {
					var idx = index || siteLayerIndex;
					if (!idx) {
						return;
					}

					var $layer = $('#layui-layer' + idx);
					var $content = $layer.find('.layui-layer-content');
					var $form = $('#id-form-rule');
					if (!$layer.length || !$content.length || !$form.length || $form.outerHeight() <= 0) {
						return;
					}

					// 先解除 layui 创建时锁定的像素高度，让内容自己撑开
					$layer.css('height', 'auto');
					$content.css('height', '');

					var titleHeight = $layer.find('.layui-layer-title').outerHeight() || 0;
					// 上下各留 24px 边距，弹窗整体不越出可视区
					var maxContentHeight = Math.max(240, $(window).height() - titleHeight - 48);

					if ($content.outerHeight() > maxContentHeight) {
						$content.css('height', maxContentHeight + 'px');
						$layer.css('height', (maxContentHeight + titleHeight) + 'px');
					}

					// 高度变化后重新垂直居中，避免底部被裁掉
					var layerHeight = $layer.outerHeight() || 0;
					$layer.css('top', Math.max(0, Math.round(($(window).height() - layerHeight) / 2)) + 'px');
				}

				function escapeHtml(text) {
					return String(text == null ? '' : text)
						.replace(/&/g, '&amp;')
						.replace(/</g, '&lt;')
						.replace(/>/g, '&gt;')
						.replace(/"/g, '&quot;')
						.replace(/'/g, '&#39;');
				}

				// popup.success 固定只显示 1 秒，保存类提示看不清，这里给 2 秒
				function showSuccess(msg) {
					layer.msg(msg || '操作成功', {icon: 1, time: 2000});
				}

				// 校验失败时把 nginx 的原始报错展示出来，便于直接定位到具体行
				function showAdvError(msg, detail) {
					var html = '<div style="padding: 12px 16px; line-height: 24px;">'
						+ '<div style="color:#f56c6c; margin-bottom: 8px;">' + escapeHtml(msg || '配置校验失败') + '</div>';

					if (detail) {
						html += '<pre style="max-height:300px; overflow:auto; background:#f7f7f7; padding:10px; font-size:12px; line-height:18px; white-space:pre-wrap; word-break:break-all;">'
							+ escapeHtml(detail) + '</pre>';
					}

					html += '</div>';

					layer.open({
						type: 1,
						title: '保存失败',
						shade: 0.6,
						area: ['660px', 'auto'],
						content: html
					});
				}

				// 高级配置：编辑指定站点的自定义 nginx 片段
				var advSiteId = null;
				var advDirty = false;

				function advArea() {
					var width = Math.min(780, Math.max(320, $(window).width() - 40));
					var textHeight = Math.min(420, Math.max(200, $(window).height() - 340));
					$('#advConfigText').css('height', textHeight + 'px');
					return [width + 'px', 'auto'];
				}

				function confirmDiscardAdv(callback) {
					if (!advDirty) {
						callback();
						return;
					}

					layer.confirm('有未保存的修改，确定放弃吗？', {
						icon: 3,
						title: '提示'
					}, function (index) {
						layer.close(index);
						callback();
					});
				}

				// 单个域名直接显示，多个域名取第一个并带上数量
				function siteDisplayName(data) {
					var names = (data && data.serverNames) || [];
					if (!names.length) {
						return '';
					}

					return names.length > 1 ? (names[0] + ' 等 ' + names.length + ' 个域名') : names[0];
				}

				// 多域名站点在正文里列出全部域名
				function renderAdvSites(serverNames) {
					var names = serverNames || [];
					if (names.length > 1) {
						$('#advConfigSites').text('生效站点：' + names.join('、')).show();
					} else {
						$('#advConfigSites').hide().text('');
					}
				}

				function openAdvConfig(siteId, siteName, serverNames) {
					var id = parseInt(siteId, 10);
					if (!id) {
						popup.warning('站点信息有误，请刷新后重试');
						return;
					}

					var loading = layer.load(1, {shade: [0.3, '#000']});
					$.get('/sites/custom/get', {id: id}, function (res) {
						layer.close(loading);

						if (!res || res.code != 200) {
							popup.failure((res && res.msg) || '读取配置失败');
							return;
						}

						advSiteId = id;
						advDirty = false;
						renderAdvSites(serverNames);
						$('#advConfigText').val((res.data && res.data.content) || '');
						advLayerIndex = layer.open({
							type: 1,
							title: '高级配置' + (siteName ? ' - ' + escapeHtml(siteName) : ''),
							shade: 0.6,
							shadeClose: false,
							area: advArea(),
							content: $('#id-form-adv'),
							success: function (layero, index, that) {
								// 遮罩层点击与右上角关闭保持一致：有未保存修改时先确认
								if (that && that.shadeo) {
									that.shadeo.on('click', function () {
										confirmDiscardAdv(function () {
											layer.close(index);
										});
									});
								}
							},
							cancel: function () {
								if (advDirty) {
									confirmDiscardAdv(function () {
										layer.close(advLayerIndex);
									});
									return false;
								}
							},
							end: function () {
								advLayerIndex = null;
								advSiteId = null;
								advDirty = false;
								$('#advConfigText').val('');
							}
						});
					}, 'json').fail(function () {
						layer.close(loading);
						popup.failure('读取配置失败');
					});
				}

				$('#advConfigText').on('input propertychange', function () {
					advDirty = true;
				});

				$('#advConfigCancel').on('click', function () {
					confirmDiscardAdv(function () {
						if (advLayerIndex !== null) {
							layer.close(advLayerIndex);
						}
					});
				});

				$('#advConfigSave').on('click', function () {
					if (!advSiteId) {
						return;
					}

					var $btn = $(this).prop('disabled', true);
					var loading = layer.load(1, {shade: [0.3, '#000']});

					$.post('/sites/custom/save', {
						id: advSiteId,
						content: $('#advConfigText').val()
					}, function (res) {
						layer.close(loading);
						$btn.prop('disabled', false);

						if (res && res.code == 200) {
							advDirty = false;
							if (advLayerIndex !== null) {
								layer.close(advLayerIndex);
							}
							showSuccess(res.msg || '已保存');
							return;
						}

						showAdvError((res && res.msg) || '保存失败', res && res.detail);
					}, 'json').fail(function () {
						layer.close(loading);
						$btn.prop('disabled', false);
						popup.failure('请求失败，请重试');
					});
				});

				function selectCert(item) {
					certSelectedId = item ? String(item.id) : '';
					$('#certId').val(certSelectedId).removeClass('layui-form-danger');
					renderCertTrigger(item || null);
					renderCertList($('#certPickerSearch').val());
					closeCertPanel();
				}

				function listCerts(certId) {
					certSelectedId = certId ? String(certId) : '';
					closeCertPanel();
					$.get('/common/certificate/listcerts', {validOnly: 1, keepId: certId || ''}, function(res) {
						if (res && res.code == 200) {
							certData = res.data || [];
							var selected = null;
							$.each(certData, function(i, item) {
								if (String(item.id) === certSelectedId) {
									selected = item;
									return false;
								}
							});

							if (selected) {
								$('#certId').val(certSelectedId);
							} else {
								certSelectedId = '';
								$('#certId').val('');
							}

							renderCertTrigger(selected);
							renderCertList('');

							if (certId) {
								setCertVisible(true);
							}

							resizeSiteLayer();
							// 布局稳定后再校正一次，避免按渲染前的旧内容计算高度
							setTimeout(function() {
								resizeSiteLayer();
							}, 0);
						} else {
							popup.failure(res.msg);
						}
					}, "json");
				}

				$('#certPickerTrigger').on('click', function(e) {
					e.stopPropagation();
					if ($('#certPicker').hasClass('open')) {
						closeCertPanel();
					} else {
						openCertPanel();
					}
				});

				$('#certPickerSearch').on('input', function() {
					renderCertList(this.value);
				}).on('keydown', function(e) {
					if (e.keyCode === 13) {
						e.preventDefault();
					}
				}).on('click', function(e) {
					e.stopPropagation();
				});

				$('#certPickerPanel').on('click', function(e) {
					e.stopPropagation();
				});

				$('#certPickerList').on('click', '.cert-picker-option', function() {
					var id = String($(this).attr('data-id'));
					var selected = null;
					$.each(certData, function(i, item) {
						if (String(item.id) === id) {
							selected = item;
							return false;
						}
					});
					if (selected) {
						selectCert(selected);
					}
				});

				$(document).on('click.certPicker', function() {
					closeCertPanel();
				}).on('keydown.certPicker', function(e) {
					if (e.keyCode === 27) {
						closeCertPanel();
					}
				}).on('mousedown.certPicker', '.layui-layer-title', function() {
					closeCertPanel();
				});

				$(window).on('scroll.certPicker resize.certPicker', function() {
					if ($('#certPicker').hasClass('open')) {
						positionCertPanel();
					}
				});

				table.render({
					elem: '#id-table-rules',
					url: '/sites/list',
					cols: [[ //标题栏
						{field: 'serverNames', title: '域名'},
						{field: 'listenPorts', title: '监听端口', templet: function(d) {
							var portsStr = '';
							$.each(d.listenPorts, function(i, item) {
								if (item.ssl == 'on') {
									portsStr += item.port + '/SSL,';
								} else {
									portsStr += item.port + ',';
								}
							});
							return portsStr.slice(0, -1);
						}},
						{field: 'mode', title: '运行模式', width: 110, templet: function(d) {
							if (d.mode == 'protection') {
								return '<div>防御</div>';
							} else if (d.mode == 'monitor') {
								return '<div>监控</div>';
							}
						}},
						{field: 'description', title: '备注', minWidth: 200},
						{fixed: 'right', title:'操作', width: 150, minWidth: 150, toolbar: '#rule_bar'}
					]],
					toolbar: '#user_toolbar',
					css:'.layui-form{margin-top:0px;}',
					page: true, // 是否显示分页
					limits: [5, 10, 15, 20, 25, 30],
					limit: 10, // 每页默认显示的数量
				});

				function openLayer(title, certId) {
					// 先显示证书区域，让弹窗初始高度就包含它
					setCertVisible(!!certId || $(":checkbox[name='ssl']:checked").length > 0);

					siteLayerIndex = layer.open({
						type: 1,
						title: title,
						shade: 0.6,
						shadeClose: true,
						area: ['620px', 'auto'],
						content: $('#id-form-rule'),
						success: function(layero, index) {
							siteLayerIndex = index;
							listCerts(certId);
							// 等弹层完成定位后再校正高度
							setTimeout(function() {
								resizeSiteLayer(index);
							}, 0);
						},
						end: function() {
							siteLayerIndex = null;
							closeCertPanel();
							certData = [];
							certSelectedId = '';
							renderCertTrigger(null);
							$("#id-form-rule").trigger("reset");
							$("#id-form-rule").find("input[type='hidden']").val("");
							$(".site-row:not(:first)").remove();
							$('#serverNames').find('button:not(:last)').remove();
							tagRender();
							setCertVisible(false);
							// 复位后重新渲染，保证下次打开时开关状态与实际值一致
							form.render(null, 'filter-form-rule');
						}
					});
				}

				// 触发单元格工具事件
				table.on('tool(filter-table-rules)', function(obj) {
					var data = obj.data; // 获得当前行数据

					if(obj.event === 'edit') {
						var serverNames = $('#serverNames');
						if (serverNames.length) {
							var html = '';
							$.each(data.serverNames, function(idx, val) {
								html += '<button lay-id="' + idx + '" type="button" class="tag-item tag-item-normal">' + val + '</button>';
							});
							serverNames.html(html);

							tagRender();
						}

						var listenPorts = data.listenPorts;

						$.each(listenPorts, function(i, item) {
							var newSite = $(".site-row:first").clone();
							if (i == 0) {
								$(".site-row:first").remove();
							}

							if (item.ssl === "on") {
								newSite.find(":checkbox[name='ssl']").prop("checked", true);
							} else {
								newSite.find(":checkbox[name='ssl']").prop("checked", false);
							}

							newSite.find(":text[name='port']").val(item.port);

							$('#addSiteRow').before(newSite);
						});

						var certId = data.certId;

						form.val('filter-form-rule', data);
						form.render(null, 'filter-form-rule');

						openLayer('编辑站点', certId);
					} else if(obj.event === 'adv') {
						openAdvConfig(data.id, siteDisplayName(data), data.serverNames);
					} else if(obj.event === 'remove') {
						layer.confirm('确定删除该站点吗？', {
							icon: 3,
							title: '提示'
						}, 
						function(index) {
							$.post('/sites/remove',  {id: data.id}, function(resData) {
								if (resData && resData.code == 200) {
									obj.del(); // 删除对应行（tr）的 DOM 结构，并更新缓存
									table.reloadData('id-table-rules');
									layer.close(index);
									if (resData.msg) {
										layer.msg(resData.msg, {icon: 0, time: 3000});
									}
									return true;
								} else {
									popup.failure(resData.msg);
									return false;
								}
							}, "json");
						});
					}
				});

				table.on('toolbar(filter-table-rules)', function(obj) {
					if (obj.event === 'add') {
						openLayer('添加站点');
					} else if (obj.event === 'refresh') {
						table.reload('id-table-rules');
					}
				});

				util.on('lay-on', {
					ruleCancel: function() {
						layer.closeLast('page');
					},
					addSite: function() {
						var newSite = $(".site-row:first").clone();

						var count = $('.site-row').length;
						if (count < 3) {
							newSite.find(":text[name='port']").val("");
							newSite.find(":checkbox[name='ssl']").prop("checked", false);
							$('#addSiteRow').before(newSite);
							form.render(null, 'filter-form-rule');
							resizeSiteLayer();
						} else {
							popup.failure("最多添加3个监听端口");
						}
					},
					removeSite: function() {
						var count = $('.site-row').length;
						if (count > 1) {
							$(this).closest(".layui-row").remove();
							resizeSiteLayer();
						} else {
							popup.failure("至少添加一个监听端口");
						}
					}
				});

				// 自定义验证规则
				form.verify({
					serverNames: function(value, elem) {
						if ($('#serverNames').find('button').length < 2) {
							return "最少添加一个域名";
						}
					},
					certId: function(value, elem) {
						if ($(":checkbox[name='ssl']:checked").length > 0) {
							if (value == "") {
								return "请选择SSL证书";
							}
						}
					}
				});

				form.on('switch(filter-switch-ssl)', function(data) {
					setCertVisible($(":checkbox[name='ssl']:checked").length > 0);
					resizeSiteLayer();
				});

				// 提交事件
				form.on('submit(filter-rule-save)', function(data) {
					var field = data.field;
					delete field.port;
					delete field.ssl;

					var serverNames = $('#serverNames');
					if (serverNames.length) {
						var arr = [];
						$('#serverNames').find('button').not(":last").each(function(i, el) {
							arr.push($(el).text().replace('ဆ','').trim())
						});
						field.serverNames = arr;
					}

					var listenPorts = [];
					$('#sites').find(':text[name="port"]').each(function(i, el) {
						var row = $(el).closest(".site-row");
						var port = {};
						port.port = $(el).val();
						port.ssl = row.find(':checkbox[name="ssl"]').prop('checked') ? 'on' : 'off';
						listenPorts.push(port);
					});
					field.listenPorts = listenPorts;

					if ($(":checkbox[name='ssl']:checked").length == 0) {
						delete field.certId;
					}

					$.post('/sites/save',  {rule: JSON.stringify(field)}, function(data) {
						if (data && data.code == 200) {
							table.reloadData('id-table-rules');
							layer.closeLast('page');
							showSuccess("已保存");
							return true;
						} else {
							popup.failure(data.msg);
							return false;
						}
					}, "json");

					return false; // 阻止默认 form 跳转
				});

				tagRender();

				tag.on('add(serverNames)', function(data) {
					var newText = $(data.othis).text().trim();
					var exists = false;
					$('#serverNames').find('button').each(function(i, el) {
						if (newText == $(el).text().replace('ဆ','').trim()) {
							exists = true;
							return;
						}
					});
					if (exists) {
						popup.failure('域名已存在');
						return false;
					}
				});

				$(function(){
					// 阻止回车触发表单提交；textarea 里的回车必须放行，否则无法换行
					$(document).on('keydown', function (e) {
						if (e.keyCode !== 13) {
							return;
						}

						var tag = (e.target && e.target.tagName ? e.target.tagName : '').toLowerCase();
						if (tag === 'textarea') {
							return;
						}

						e.preventDefault();
						return false;
					});
				});
			});
		</script>
	</body>
</html>
