<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>安全验证</title><style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.zk-challenge{width:100%;text-align:center;max-width:520px;padding:24px;margin-top:28vh;animation:fadeIn .4s ease forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.zk-icon{width:40px;height:40px;margin:0 auto 14px;position:relative}
.zk-icon svg{width:100%;height:100%;position:absolute;top:0;left:0;transition:opacity .3s ease,transform .3s ease}
.zk-spinner{border:2.5px solid rgba(0,0,0,.06);border-top-color:#2563eb;border-radius:50%;width:100%;height:100%;animation:zk-spin .7s linear infinite}
@keyframes zk-spin{to{transform:rotate(360deg)}}
.zk-svg-ok,.zk-svg-err{opacity:0;transform:scale(.8)}
.zk-title{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px;transition:color .3s ease}
.zk-desc{font-size:14px;color:#666;line-height:1.6}
.zk-challenge:not(.is-ok):not(.is-err) .zk-desc{color:rgba(0,0,0,.55);letter-spacing:.02em}
.zk-retry{display:none;margin-top:20px;padding:10px 32px;font-size:14px;font-weight:500;letter-spacing:.01em;color:#fff;background:#1a1a1a;border:none;border-radius:8px;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
.zk-retry:hover{opacity:.88}
.zk-retry:active{transform:scale(.97)}
.zk-help{display:none;width:max-content;max-width:100%;margin:16px auto 0;text-align:left;position:relative}
.zk-help-toggle{font-size:13px;color:#555;background:none;border:none;cursor:pointer;padding:0;margin-left:16px;text-decoration:none;border-bottom:1px dashed #999;transition:color .2s,border-color .2s}
.zk-help-toggle:hover{color:#1a1a1a;border-color:#1a1a1a}
.zk-help-body{max-height:0;overflow:hidden;margin-top:6px;font-size:13px;color:#666;line-height:1.9;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s ease,transform .25s ease,visibility .25s,max-height .25s ease}
.zk-help.open .zk-help-body{max-height:400px;opacity:1;visibility:visible;transform:translateY(0)}
.zk-help-body ul{display:inline-block;max-width:100%;text-align:left;padding-left:16px}
.zk-help-body li{margin:2px 0}
.is-ok .zk-spinner{display:none}
.is-ok .zk-svg-ok{opacity:1;transform:scale(1);color:#16a34a}
.is-ok .zk-title{color:#16a34a}
.is-err .zk-spinner{display:none}
.is-err .zk-svg-err{opacity:1;transform:scale(1);color:#dc2626}
.is-err .zk-title{color:#dc2626}
.is-err .zk-retry{display:inline-block}
.is-err .zk-help{display:block}
.is-challenge .zk-spinner{border-top-color:#2563eb}
.is-challenge .zk-title{color:#1a1a1a}
.is-challenge .zk-retry{display:inline-block}
</style></head>
<body>
<img src="/captcha/beacon?c=$challenge-id" width="1" height="1" alt="" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;border:0">
<div class="zk-challenge" id="zkChallenge">
<div class="zk-icon"><div class="zk-spinner"></div><svg class="zk-svg-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><svg class="zk-svg-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
<h1 class="zk-title" id="zkTitle">正在确认访问环境…</h1>
<p class="zk-desc" id="zkDesc">ZhongKui WAF · 自动化安全校验</p>
<button class="zk-retry" onclick="retryVerification()">重新验证</button>
<div class="zk-help">
<button class="zk-help-toggle" onclick="toggleHelp()">为什么我无法通过验证？</button>
<div class="zk-help-body" id="zkHelpBody">
<ul><li>请确保浏览器已启用 JavaScript 与 Cookie</li><li>暂时关闭广告拦截 / 隐私保护扩展后重试</li><li>使用最新版 Chrome / Firefox / Edge / Safari</li><li>企业网络用户请联系 IT 管理员放行安全网关</li></ul>
</div>
</div>
</div>
<script>
var $c=document.getElementById('zkChallenge'),$title=document.getElementById('zkTitle'),$desc=document.getElementById('zkDesc'),$helpBody=document.getElementById('zkHelpBody');
function toggleHelp(){$helpBody.parentElement.classList.toggle('open');}
function showOk(){$c.className='zk-challenge is-ok';$title.textContent='验证通过';$desc.textContent='正在跳转…';try{sessionStorage.removeItem('zkChRetry');}catch(e){}setTimeout(function(){window.location.href=window.location.href;},600);}
function showErr(msg){$c.className='zk-challenge is-err';$title.textContent='验证未完成';$desc.textContent=msg||'无法确认您的浏览器环境，请重试。';}
function showChallenge(){$c.className='zk-challenge is-challenge';$title.textContent='正在重新验证…';$desc.textContent='环境评分偏低，正在自动重试。';var n=0;try{n=parseInt(sessionStorage.getItem('zkChRetry')||'0',10)||0;}catch(e){}if(n>=2){showErr('环境评分持续偏低，请稍后重试');return;}try{sessionStorage.setItem('zkChRetry',String(n+1));}catch(e){}setTimeout(function(){window.location.href=window.location.href;},800);}
function retryVerification(){try{sessionStorage.removeItem('zkChRetry');}catch(e){}window.location.href=window.location.href;}
window.onerror=function(m,u,l,c,e){showErr('脚本运行异常: '+m);return true;};
var behaviorSignals={mouseMoves:0,scrollEvents:0,keyEvents:0};
var browserScoreResult={details:{}};
var challengeStartTime=0;
var formulaResult=$formula;
var captchaSign='$captcha-sign';
var captchaTime=$captcha-time;
(function(){
try{
var _hex='0123456789ABCDEF';
var _s=('$challenge-id'+'$probe-token').toUpperCase();
var _out='';
for(var _i=0;_i<_s.length;_i++){
var _d=parseInt(_s.charAt(_i),16);
var _k=(_i*5+1)%16;
_out+=_hex.charAt((_d+_k)%16);
}
document.cookie='waf_challenge='+_out+'; path=/; SameSite=Lax; Max-Age=300';
}catch(e){}
})();
var isNativeFn=function(fn){try{return Function.prototype.toString.call(fn).indexOf('[native code]')!==-1;}catch(e){return false;}};
var countNativeFailures=function(){var f=0;try{var c=[eval,document.querySelector,window.setTimeout,window.alert,document.createElement];for(var i=0;i<c.length;i++)if(!isNativeFn(c[i]))f++;}catch(e){f=5;}return f;};
var HEADLESS_GLOBALS=['callPhantom','_phantom','__nightmare','__webdriver','__driver_evaluate','__scenario__'];
var safeRead=function(fn,fb){try{return fn();}catch(e){return fb;}};
function detectWebGL(){
var r={renderer:null,software:false,supported:false};
try{
var cv=document.createElement('canvas'),gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
if(!gl){r.renderer='unsupported';return r;}
r.supported=true;
var ext=gl.getExtension('WEBGL_debug_renderer_info');
if(ext){r.renderer=String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'');var lw=r.renderer.toLowerCase();r.software=(lw.indexOf('llvmpipe')!==-1||lw.indexOf('swiftshader')!==-1);}
}catch(e){r.renderer='unsupported';}
return r;
}
function calcWebglScore(w){if(!w.supported)return 0;if(w.software)return 3;return 10;}
function collectBrowserInfo(){
var nf=countNativeFailures();
var wg=detectWebGL();
var hg=[];
for(var i=0;i<HEADLESS_GLOBALS.length;i++)if(HEADLESS_GLOBALS[i] in window)hg.push(HEADLESS_GLOBALS[i]);
var langs=safeRead(function(){return(navigator.languages&&typeof navigator.languages.join==='function')?navigator.languages.join(','):'undefined';},'undefined');
return {
userAgent:safeRead(function(){return navigator.userAgent;},''),
cookieEnabled:safeRead(function(){return navigator.cookieEnabled;},null),
screenWidth:safeRead(function(){return screen.width;},0),
screenHeight:safeRead(function(){return screen.height;},0),
availWidth:safeRead(function(){return screen.availWidth;},0),
availHeight:safeRead(function(){return screen.availHeight;},0),
hasTouch:safeRead(function(){return 'ontouchstart' in window;},false),
webdriver:safeRead(function(){return navigator.webdriver;},false),
plugins:safeRead(function(){return navigator.plugins?navigator.plugins.length:0;},0),
mimeTypes:safeRead(function(){return navigator.mimeTypes?navigator.mimeTypes.length:0;},0),
platform:safeRead(function(){return navigator.platform||'';},''),
maxTouchPoints:safeRead(function(){return (typeof navigator.maxTouchPoints==='number')?navigator.maxTouchPoints:-1;},-1),
devicePixelRatio:safeRead(function(){return (typeof window.devicePixelRatio==='number'&&window.devicePixelRatio>0)?window.devicePixelRatio:0;},0),
innerWidth:safeRead(function(){return window.innerWidth||0;},0),
innerHeight:safeRead(function(){return window.innerHeight||0;},0),
nativeFailedCount:nf,webglRenderer:wg.renderer,webglSoftware:wg.software,
language:safeRead(function(){return navigator.language;},''),
languages:langs,headlessGlobals:hg
};
}
function scoreBrowser(){
var nav=navigator,doc=document,win=window,d={},fatal=null,tErr=false;
try{
var ua=nav.userAgent.toLowerCase();
if(nav.webdriver===true||doc.documentElement.getAttribute('webdriver'))fatal='检测到 WebDriver 属性';
else{
var kw=['headless','webdriver','puppeteer','selenium','chromedriver','phantomjs'],fk=null;
for(var i=0;i<kw.length;i++)if(ua.indexOf(kw[i])!==-1){fk=kw[i];break;}
if(fk)fatal='UA 含禁用关键词: '+fk;
else{for(var j=0;j<HEADLESS_GLOBALS.length;j++)if(HEADLESS_GLOBALS[j] in win){fatal='检测到 Headless 全局变量: '+HEADLESS_GLOBALS[j];break;}}
}
if(fatal)return{details:d,fatal:fatal,telemetryError:tErr};
var mob=/(android|webos|iphone|ipad|ipod|blackberry|windows phone|mobile)/i.test(ua);
var nfc=countNativeFailures();d.nativeFunctions=nfc>=3?0:(nfc>=1?5:10);
if(!mob){var ps=10;if(!nav.plugins||!nav.mimeTypes)ps=0;else if(typeof nav.plugins.length!=='number'||typeof nav.mimeTypes.length!=='number')ps=2;d.plugins=ps;}else d.plugins=10;
var wg=detectWebGL();d.webgl=calcWebglScore(wg);
var ss=5,mw=mob?200:400,mh=mob?300:400,aw=win.screen.availWidth||win.screen.width,ah=win.screen.availHeight||win.screen.height;
if(aw<mw||ah<mh)ss=0;d.screenSize=ss;
d.touchSupport=mob?(typeof TouchEvent==='undefined'?0:5):5;
var ls=3;
if(typeof nav.languages!=='undefined'&&Array.isArray(nav.languages)){if(!nav.languages.length)ls=0;else for(var li=0;li<nav.languages.length;li++)if(!nav.languages[li]||typeof nav.languages[li]!=='string'){ls=0;break;}}
d.language=ls;
var cs=10;
var plat=safeRead(function(){return nav.platform||'';},'').toLowerCase();
var uaW=ua.indexOf('windows')!==-1,uaM=ua.indexOf('mac os x')!==-1,uaA=ua.indexOf('android')!==-1;
var uaI=ua.indexOf('iphone')!==-1||ua.indexOf('ipad')!==-1||ua.indexOf('ipod')!==-1;
var platOk=!(uaW&&plat.indexOf('win')===-1);
if(uaM&&plat.indexOf('mac')===-1&&!(uaI&&(plat.indexOf('iphone')!==-1||plat.indexOf('ipad')!==-1||plat.indexOf('ipod')!==-1)))platOk=false;
if(uaA&&plat.indexOf('linux')===-1&&plat.indexOf('android')===-1)platOk=false;
if(!platOk)cs-=4;
var mtp=safeRead(function(){return (typeof nav.maxTouchPoints==='number')?nav.maxTouchPoints:0;},0);
if(mob&&mtp===0)cs-=3;
var iw=win.innerWidth||0;
if(!mob&&iw>0&&iw<200)cs-=3;
var dpr=safeRead(function(){return win.devicePixelRatio||0;},0);
if(dpr<=0)cs-=2;
if(cs<0)cs=0;
d.consistency=cs;
}catch(e){tErr=true;}
return{details:d,fatal:fatal,telemetryError:tErr};
}
function startBehavior(){
behaviorSignals={mouseMoves:0,scrollEvents:0,keyEvents:0};
var mm=function(){behaviorSignals.mouseMoves++;},sc=function(){behaviorSignals.scrollEvents++;},kd=function(){behaviorSignals.keyEvents++;};
document.addEventListener('mousemove',mm,{passive:true});
document.addEventListener('scroll',sc,{passive:true});
document.addEventListener('keydown',kd,{passive:true});
return function(){
document.removeEventListener('mousemove',mm);
document.removeEventListener('scroll',sc);
document.removeEventListener('keydown',kd);
};
}
function handleVerifyResponse(xhr){
try{
var d=JSON.parse(xhr.responseText);
if(d.result==='success')showOk();
else if(d.result==='challenge')showChallenge();
else showErr(d.reason||'unknown');
}catch(e){showErr('验证响应异常，请重试');}
}
function verify(){
var info=collectBrowserInfo();
info.details=browserScoreResult.details;
var payload={challenge_id:'$challenge-id',captcha_result:formulaResult,behavior:behaviorSignals,browser_info:info};
var body='payload='+encodeURIComponent(JSON.stringify(payload));
var url='/captcha/challenge?r='+Math.random();
if(window.fetch){
fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Captcha-Sign':captchaSign,'Captcha-Time':captchaTime},credentials:'same-origin',body:body})
.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
.then(function(d){
if(d.result==='success')showOk();
else if(d.result==='challenge')showChallenge();
else showErr(d.reason||'unknown');
})
.catch(function(e){showErr('网络连接失败，请检查网络或关闭拦截插件');});
}else{
var xhr=new XMLHttpRequest();
xhr.open('POST',url,true);
xhr.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
xhr.setRequestHeader('Captcha-Sign',captchaSign);
xhr.setRequestHeader('Captcha-Time',captchaTime);
xhr.withCredentials=true;
xhr.onreadystatechange=function(){if(xhr.readyState===4){
if(xhr.status>=200&&xhr.status<300)handleVerifyResponse(xhr);
else showErr('网络连接失败('+xhr.status+')，请检查网络或关闭拦截插件');
}};
xhr.onerror=function(){showErr('网络连接失败，请检查网络或关闭拦截插件');};
xhr.send(body);
}
}
var MIN_VERIFY_MS=3000;
function runChallenge(){
var stop=startBehavior();
challengeStartTime=Date.now();
function hold(fn){
setTimeout(fn,Math.max(0,MIN_VERIFY_MS-(Date.now()-challengeStartTime)));
}
try{
browserScoreResult=scoreBrowser();
hold(function(){
stop();
if(browserScoreResult.fatal)showErr('环境检测未通过 ('+browserScoreResult.fatal+')');
else verify();
});
}catch(e){
stop();
hold(function(){showErr('验证脚本异常，请刷新重试');});
}
}
runChallenge();
</script>
</body></html>
